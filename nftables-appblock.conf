table inet myapp {
  sets {
    block_youtube { type ipv4_addr . inet_service; flags interval; timeout 300s; }
    block_tiktok  { type ipv4_addr . inet_service; flags interval; timeout 300s; }
    block_spotify { type ipv4_addr . inet_service; flags interval; timeout 300s; }
  }

  chains {
    filter_forward {
      type filter hook forward priority 0; policy accept;
      tcp dport {80,443} queue num 0;
      ip daddr . tcp dport @block_youtube drop
      ip daddr . tcp dport @block_tiktok drop
      ip daddr . tcp dport @block_spotify drop
    }
  }
}
